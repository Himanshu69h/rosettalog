[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosettalog"
version = "0.1.0"
description = "Lossless, traceable, OCSF-aligned log parsing framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0,<7",
    "drain3>=0.9.11,<1",
    "google-re2>=1.1.20240702,<2",
    "pyarrow>=17,<19",
    "duckdb>=1.0,<2",
    "zstandard>=0.23,<1",
    "hypothesis>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest-cov>=5,<6",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.36,<2",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.26,<5",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
]
ui = [
    "streamlit>=1.36,<2",
]
re2 = [
    "google-re2>=1.1.20240702,<2",
]
fuzz = [
    "hypothesis>=6.108,<7",
]
analytics = [
    "pyarrow>=17,<19",
    "duckdb>=1.0,<2",
    "zstandard>=0.23,<1",
    "ulid-py>=1.1,<2",
]
all = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.36,<2",
    "hypothesis>=6.108,<7",
    "ulid-py>=1.1,<2",
]

[project.scripts]
rosetta = "rosettalog.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["drain3", "drain3.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
