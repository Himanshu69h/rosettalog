version: "3.9"

services:
  rosetta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rosetta-gate0
    volumes:
      - .:/app
      - ./wheels:/wheels
    working_dir: /app
    command: ["python", "-m", "rosettalog.cli", "--help"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rosetta-api
    command: ["python", "-m", "uvicorn", "rosettalog.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - rosetta

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rosetta-ui
    command: ["python", "-m", "streamlit", "run", "src/rosettalog/ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - api
